<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Credit Data Files</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h2>CREDIT CARD FRAUD DETECTION</h2>
        <h3>Upload Credit Data Files</h3>
        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="filename">File Name</label>
                <input type="text" id="credit data" name="credit data" class="form-control">
            </div>
            <div class="form-group">
                <label for="file">Upload Credit Card Dataset File</label>
                <input type="file" id=" Choose File" name="Choose File" class="form-control">
            </div>
            <div class="form-group">
                <label for="description">Description of the File</label>
                <textarea id="description" name="description" class="form-control"></textarea>
            </div>
        </form>
        <style>
        .GFG {
           width:100px;
           height:50px;
           background:green;
           border:none;
           color:white;
        }
    </style>
    <form
      action="datasetanalysis.html">
    <button type="Submit" class="GFG">Upload</button>
    </form>

    </div>
</body>
</html>
